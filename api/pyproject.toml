[project]
name = "newsdesk"
version = "0.1.0"
description = "Governed generative video for newsrooms"
requires-python = ">=3.12"
dependencies = [
    "genblaze-cli>=0.3.5",
    "genblaze-core>=0.3.7",
    "genblaze-elevenlabs>=0.3.2",
    "genblaze-gmicloud>=0.3.4",
    "genblaze-lmnt>=0.3.2",
    "genblaze-s3>=0.3.6",
    "pyarrow>=25.0.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "typer>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["newsdesk"]
