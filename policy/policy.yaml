# Newsdesk editorial policy — v2
#
# This file is the newsroom-standards artifact. The Policy page renders it
# directly and the README ships it, so it is written to be read by an editor,
# not only parsed by a gate.
#
# Every rule carries three things: a plain-language name an editor can quote, a
# one-line reason, and the layer that enforces it. Rules whose layer is
# `deterministic` cost nothing and run first; nothing paid happens until they
# all pass.

version: 2
updated: 2026-08-03

# Where each rule is actually enforced.
#   deterministic — pure code, no network. Free, and cannot be talked out of it.
#   llm           — semantic check via chat(). Runs only on prompts that already
#                   passed deterministically, so it never spends on obvious violations.
#   vision        — post-render evaluation of the generated image or clip.
#                   The only layer that can catch what a compliant prompt produced.

rules:
  - id: POL-1
    name: No real-person likenesses
    why: >
      A generated face that resembles a real person is a fabrication attributed
      to someone who never said or did it. There is no editorial use of this
      that a silhouette or an abstract stand-in cannot serve.
    layers: [deterministic, llm]
    check: >
      Reject named individuals, and descriptions that resolve to one specific
      real person even when unnamed.
    compliant_alternative: >
      An abstract silhouette, an empty podium, an archival object associated
      with the role rather than the person.

  - id: POL-2
    name: The exclusion line is fixed
    why: >
      The NEGATIVE line is a policy constant, not a prompt suggestion. If a
      caller can edit it, the prohibitions are advisory.
    layers: [deterministic]
    check: >
      NEGATIVE must be present and begin, byte-for-byte, with the platform floor
      (brand-kit/floor.txt). A kit may only append to that floor, never edit or
      remove from it.
    note: >
      Enforceable at render time on video only. Gemini image generation has no
      negative-prompt mechanism — Google's docs state unlisted parameters are
      silently ignored — so on the image step this rule proves intent, not
      outcome. POL-4 and POL-6 are what actually catch image violations.
    changelog: >
      v3 (2026-08-02) split the single constant into brand-kit/floor.txt (the
      harms POL-1 and POL-3 exist for — photorealism, live-action footage, 3D
      render, lip-sync, talking characters, watermark, logo — which no kit may
      ever narrow) and a per-kit brand-kit/negative.txt of additions above that
      floor. The house kit's negative.txt now carries only the text-exclusion
      terms it used to share with the floor; in effect the house kit is
      unchanged, because negative_line("house") still composes to the same set
      of prohibitions. What changed is that the check above no longer reads
      "byte-identical to brand-kit/negative.txt" — that wording compared a kit
      against itself and would have let a second kit rewrite its own negative.txt
      to drop the floor's terms. The check now reads "begins with the floor",
      which no kit can pass by editing its own file.
      This split exists because the diorama kit's letterpress-label signature
      needs to permit exactly one kind of on-prop text (POL-4's narrow,
      fact-mapped case) while every other harm this line exists to forbid stays
      absolute. Add-only above a single shared constant could not express that;
      a fixed floor plus a narrowable per-kit remainder can.
      v2 (2026-07-28) extended the (then-single) constant with "repeated text,
      doubled text, two lines of identical text". The exclusion list previously
      named text in general but not its most common rendered form — models that
      do produce lettering tend to produce it twice, stacked or mirrored, and a
      term for the general case does not reliably suppress the specific one.
      Terms taken from the Vox-Style Explainer Prompt Pack (Zubair Trabzada, AI
      Workshop), whose negative prompt carries them for exactly this reason.
      The change history lives here because it cannot live in the file: the
      whole of brand-kit/floor.txt and brand-kit/negative.txt is sent to the
      provider byte-for-byte, so a comment line would become part of the
      prohibition. Both wordings stay in this record; corrections are kept, not
      overwritten.

  - id: POL-3
    name: No fabricated news scenes
    why: >
      Photoreal footage of an event that did not happen is the specific harm
      generative video introduces to journalism. Collage cannot be mistaken
      for a camera.
    layers: [deterministic, llm]
    check: >
      Reject photoreal style requests and scene framings that present generated
      imagery as documentary footage.

  - id: POL-4
    name: No readable text on screen
    why: >
      Words rendered inside a frame read as quotation. AI lettering also
      garbles, which turns a garbled word into an apparent misquote.
    layers: [deterministic, vision]
    check: >
      SCENE must not request readable text. Any on-prop text must map to an
      entered fact ID, or be a claims-validated block label the caller
      attests to via `check(..., labels=...)` (v4, below).
    threshold: >
      Text is a violation when it is readable at normal viewing size — a
      viewer watching on a phone can make out a word or a number. Sub-legible
      marks that read as paper texture, engraving, or tick marks are not
      violations.
    threshold_why: >
      The harm this rule exists to prevent is a viewer reading a fabricated
      word. A mark no viewer can resolve cannot misinform anyone. A rule
      written as "no marks at any magnification" would fire on nearly every
      block, and a gate that blocks everything gets switched off — which is
      how policy layers actually die. This threshold is stated in the README
      rather than hidden: the claim is "no readable text", never "no text".
    prompting_rule: >
      Never append a negation list to SCENE. Gemini image generation has no
      negative-prompt mechanism, and Google's guidance is explicit that
      narrative description beats keyword lists. Name blankness as a positive
      property of the object, in the sentence that introduces it, and say what
      IS on its surface so the model has something to render instead of
      inventing detail. Full rules and the six verified renders behind them:
      brand-kit/scene-guidance.txt.
    element_budget: >
      Where a frame is permitted to carry lettering at all — the question-on-prop
      case, and only when it maps to an entered fact — at most THREE text
      elements may appear in the scene, and no single element may exceed FOUR
      words. Checked deterministically.
    element_budget_why: >
      Past that budget models stop rendering text and start approximating it:
      duplicating an element, stacking two near-identical lines, or garbling the
      longer one. A garbled word is worse than no word, because a viewer reads it
      as a misquote of a real source rather than as an artefact. The numbers are
      not ours — they are the working thresholds published in the Vox-Style
      Explainer Prompt Pack (Zubair Trabzada, AI Workshop), which states the
      failure plainly: "a MAXIMUM of three text elements per scene and a maximum
      of four words in any title, or the model will duplicate or garble the
      words." They agree with this project's own guidance arrived at separately —
      brand-kit/through-lines.yaml already tells authors to keep an on-prop
      question to two or three words.
    known_limitation: >
      Three of six test renders produced text despite instruction. Objects that
      natively carry typography — dials, gauges, banknotes, signs, screens —
      pull lettering into the frame regardless. Prompting reduces the rate; it
      does not eliminate it. POL-6 is the enforcement.
      The element budget bounds the damage where text is permitted. It does
      nothing about text that arrives uninvited, which stays POL-6's job.
    changelog: >
      v4 (2026-08-02) extended the sourcing test itself. v3, directly below,
      split the NEGATIVE-line half so a kit COULD permit on-prop text — but
      `gate.check`'s sourcing test still read "a quoted string is sourced if
      it matches an entered fact ID", which gave the diorama kit's own
      signature no legal path: a letterpress label is validated by claims.py
      against a fact, not typed by the fact itself, so it never appeared in
      `fact_ids` and every labelled block was refused as unsourced text. The
      test now reads "sourced if it matches a fact ID OR case-insensitively
      equals one of the labels the caller attests were claims-validated" —
      `check(prompt, labels=(block.label,))`. The element budget, the word
      budget, and the "unsourced text outranks a budget complaint" ordering
      are all unchanged and bind labels exactly as they bind fact-sourced
      text; only what counts as "sourced" grew a second legal path. A caller
      that passes an unvalidated string as a label defeats this the same way a
      caller that lies about `fact_ids` already could — the gate trusts the
      attestation once, at the boundary, rather than re-deriving it, because
      re-deriving it would mean importing claims.py into gate.py's import
      graph, which tests/test_structure.py exists specifically to forbid.
      Review caught a second gap in the same v4 change, closed same day: the
      sourcing test above is only reachable at all if the label survives as a
      matched span of gate.py's `_QUOTED` pattern, which captures a quoted
      run of 2-40 characters. `LABEL_MAX_WORDS` bounds word count, not
      character count, so a legal four-word label can still land outside that
      window (or, separately, carry a quote mark of its own and corrupt the
      match) — and a label `_QUOTED` cannot see is not refused, it is simply
      absent from what POL-4 inspects, which reads as passing having checked
      nothing. This is squarely `element_budget_why`'s failure mode — a model
      asked to letterpress an over-long or malformed string comes back
      garbled or duplicated — so it is recorded here rather than as a new
      rule. Two changes close it: claims.py now enforces `LABEL_MAX_CHARS =
      40` and rejects a label containing a quote character, at the one place
      a label is minted (`label_unsourceable`); and `gate.check`, as a second
      line of defence for a future caller that skips claims.py, refuses when
      an attested label in `labels` does not actually appear among
      `_QUOTED`'s captures, rather than silently finding nothing to check.
      v3 (2026-08-02) — this rule's text is now enforced by two layers that
      moved independently. The vision/element-budget checks above are
      unchanged. What moved is the NEGATIVE-line half: "readable text, letters,
      words, numbers, captions, subtitles" used to live inside the single
      constant POL-2 fixed absolutely, so no kit could ever request the on-prop
      lettering this rule's own "entered fact ID" exception describes. It now
      lives in brand-kit/negative.txt, the narrowable per-kit remainder above
      POL-2's floor — narrowable meaning a kit may drop terms from its own
      copy, never that it may touch the floor. The house kit's copy is
      unchanged in effect: negative_line("house") still carries every term
      above, so this rule's threshold, element budget, and known limitation all
      hold exactly as before for the house kit. A kit built to permit its one
      fact-mapped on-prop label — the diorama kit's letterpress signature — is
      the reason the split exists; nothing about what counts as a violation
      changed to make room for it. Previous wording had no changelog because
      the rule had not changed since v2; this entry starts the record here
      rather than backfill a history that was not written contemporaneously.

  - id: POL-5
    name: Narration fits its block
    why: >
      Six takes near ten seconds is what keeps the piece near sixty. A take well
      outside the window makes the story longer or shorter than intended.
    why_changed: >
      v2 (2026-07-28). This previously read: "A take that overruns gets
      speed-compressed and reads as rushed; a short one gets centred and reads as
      out of sync." Both halves described an assembler that no longer exists.
      Design spec 6.6 replaced the fixed ten-second window with an audio-led
      model — block length is derived from the take, the voice is never
      speed-compressed, and nothing is centred — so this rule stopped being a
      sync constraint and became a RUNTIME BUDGET. The check and its numbers are
      unchanged; only the reason is. Worth knowing before anyone tightens it
      further on sync grounds, because that argument no longer applies.
    layers: [deterministic]
    check: >
      Narration is 23-27 words across 2-3 sentences. This is a coarse
      pre-flight bound only — the enforcement is the take measured after
      rendering.
    calibration: >
      Measured against the actual voice on 2026-07-28, not inherited. Four
      takes on eleven_v3: 22 words ran 8.96s, 26 words ran 8.88s, and the only
      take that landed in window was 22 words across five sentences at 9.92s.
      Word count is a poor predictor; sentence-end pauses fill the window. This
      reverses the imported vox guidance, which was calibrated on a slower
      voice and recommends one flowing sentence.

  - id: POL-6
    name: Output is checked, not just the request
    why: >
      A compliant prompt can still produce a violating frame. On 2026-07-26 the
      first CS-1 scene rendered legible numerals despite an explicit exclusion.
      Checking only the request would have shipped it.
    layers: [vision]
    check: >
      Every rendered asset is evaluated for photorealism, live-action
      appearance, and readable text before it can reach the approval gate.

  - id: POL-7
    name: A pasted URL is a story you reported, not one you're borrowing
    why: >
      Ingest-from-URL (PLAN.md §B4) is a shortcut for a reporter starting from
      a piece they already filed, not a way to pull someone else's journalism
      into a video with their byline nowhere on it. "Paste a link to a story
      you reported" is the UI copy for a reason — a provenance tool that
      quietly ingests someone else's work has a problem it cannot argue its
      way out of, no matter how well it cites its quotes.
    layers: [deterministic]
    check: >
      Every proposed fact carries the URL the journalist pasted and the
      verbatim span of that page it came from. If the proposed quote is not a
      character-for-character substring of the fetched article — checked with
      claims.normalize, the same discipline claims.py applies to narration —
      the proposal is dropped before it is ever shown, not flagged, not
      returned with a warning. `ingest.py`'s Proposal.url is always the
      pasted URL, copied verbatim; a model never writes a citation. This
      check proves the quote is on the page — the fact's wording is the
      model's and is confirmed by the journalist, not by this check.
