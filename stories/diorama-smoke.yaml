# The diorama kit's smoke story.
#
# CS-1's facts, unchanged and still sourced — the point of this file is the two
# lines under the title, not the reporting. Same story, different kit, so a
# render can be put beside the CS-1 house cut and the difference read off two
# videos of the same six facts rather than argued about.
#
# `kit: diorama` is what routes it: the style tokens, the through-line menu, the
# narrator, the subtitle style and the exclusion additions all come from
# brand-kit/diorama/, which is published to b2://newsdesk-brand-kit/kit/diorama/.
# `note-stack` is that menu's money object — a stack of burnt-orange notes drawn
# down one layer per block, which is what a rescinded fund looks like as an
# object.
#
# It lands in its own storage prefix (`diorama-smoke-note-stack/`), so nothing
# it renders can overwrite a CS-1 asset.

id: diorama-smoke
title: Who pays when public radio goes dark?
through_line: note-stack
kit: diorama

facts:
  - text: >-
      The July 2025 rescissions package eliminated $1.1 billion in previously
      approved CPB funding covering fiscal years 2026 and 2027
    sources:
      - url: https://www.npr.org/2025/08/01/cpb-rescission
      - citation: TIME, August 1 2025

  - text: >-
      CPB — the conduit that has distributed federal funds to more than 1,500
      local public radio and TV stations since 1967 — announced it would wind
      down, and its board voted to dissolve in January 2026
    sources:
      - url: https://www.npr.org/2026/01/06/cpb-dissolve

  - text: >-
      CPB cut roughly 70 percent of its staff and began closing out grants
      after October 1 with no new funding
    sources:
      - url: https://www.cpb.org/impact

  - text: >-
      WPBS in Watertown, New York lost about $1 million — a third of its budget
      — and reduced its workforce by 30 percent; KUAC in Fairbanks lost $1.2
      million and cut overnight broadcasts; Basin PBS in West Texas lost 48
      percent of its revenue
    sources:
      - url: https://www.cpb.org/impact

  - text: >-
      Rural and tribal stations were hit hardest, putting Native Public Media's
      network of 57 radio and 4 television stations at risk
    sources:
      - citation: The Conversation, "Rural and tribal stations hit hardest"

  - text: >-
      Some metropolitan stations saw donation surges after the cuts, including
      in Nashville, Louisville and at KUOW Seattle
    sources:
      - url: https://www.npr.org/2025/08/01/cpb-rescission
