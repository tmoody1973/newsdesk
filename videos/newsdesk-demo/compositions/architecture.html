<!doctype html>

            <g class="box t4"><rect x="488" y="86" width="180" height="118" fill="none" stroke="#f2322f" stroke-width="2" />
              <text x="497" y="103" font-size="11" fill="#f2322f">THE THREE WALLS</text>

            <g class="box t6"><rect x="12" y="146" width="150" height="40" fill="#eae8e3" stroke="#353334" stroke-width="2" />

            <g class="box t6"><rect x="12" y="196" width="150" height="40" fill="#eae8e3" stroke="#353334" stroke-width="2" />

              <text x="87" y="227" text-anchor="middle" font-size="9.5" fill="#7c7a74">fallback voice</text></g>

            <line class="arrow t7" x1="530" y1="204" x2="380" y2="214" stroke="#353334" stroke-width="1.5" marker-end="url(#arch-arr)" />
            <text class="lbl t7" x="478" y="232" text-anchor="middle" font-size="9.5" fill="#7c7a74">pass &#183; reject &#183; revise</text>
            <g class="box t7"><rect x="238" y="216" width="170" height="52" fill="#eae8e3" stroke="#353334" stroke-width="2" />
              <text x="323" y="237" text-anchor="middle" font-size="11" fill="#f2322f">DECISION LEDGER</text>

            <line class="arrow t8" x1="323" y1="268" x2="323" y2="308" stroke="#353334" stroke-width="1.5" marker-end="url(#arch-arr)" />
            <line class="arrow t8" x1="578" y1="204" x2="578" y2="308" stroke="#353334" stroke-width="1.5" marker-end="url(#arch-arr)" />
            <line class="arrow t8" x1="87" y1="236" x2="140" y2="308" stroke="#353334" stroke-width="1.5" marker-end="url(#arch-arr)" />

            <line class="arrow t9" x1="360" y1="408" x2="360" y2="448" stroke="#353334" stroke-width="1.5" marker-end="url(#arch-arr)" />
            <text class="lbl t9" x="372" y="432" font-size="9.5" fill="#7c7a74">assembly, only after a named approval</text>
            <g class="box t9"><rect x="200" y="452" width="320" height="60" fill="#eae8e3" stroke="#353334" stroke-width="2" />
              <text x="360" y="474" text-anchor="middle" font-size="11" fill="#353334">PUBLISHED MP4</text>
              <text x="360" y="490" text-anchor="middle" font-size="9.5" fill="#7c7a74">manifest embedded in the file &#183; ledger digest folded in</text></g>
            <text class="lbl t10 pulse" x="360" y="503" text-anchor="middle" font-size="9.5" fill="#f2322f">edit one refusal afterwards &#8594; genblaze verify fails</text>
          </g>
        </svg>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        (function () {
          const tl = gsap.timeline({ paused: true });
          const scope = document.querySelector('[data-composition-id="architecture"]') || document;
          const delays = { t1: 0.26, t2: 0.78, t3: 1.3, t4: 2.08, t5: 3.51, t6: 4.16, t7: 5.2, t8: 6.24, t9: 7.54, t10: 8.58 };
          for (const [tier, at] of Object.entries(delays)) {
            scope.querySelectorAll(".box." + tier + ", .lbl." + tier).forEach((el) => {
              tl.fromTo(el, { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, at);
            });
            scope.querySelectorAll(".arrow." + tier).forEach((el) => {
              tl.fromTo(el, { strokeDashoffset: 300, opacity: 0 }, { strokeDashoffset: 0, opacity: 1, duration: 0.6, ease: "power1.out" }, at);
            });
          }
          scope.querySelectorAll(".pulse").forEach((el) => {
            tl.to(el, { opacity: 0.45, duration: 1.2, ease: "sine.inOut" }, 9.2);
            tl.to(el, { opacity: 1, duration: 1.2, ease: "sine.inOut" }, 10.4);
          });
          window.__timelines["architecture"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
