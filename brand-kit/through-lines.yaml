# Through-line objects — the art-direction menu.
#
# One physical metaphor travels through every block and escalates; the viewer
# holds it the whole runtime and the kicker pays it off. Design it before
# writing any block.
#
# The menu IS the policy boundary. A journalist picks a label and a meaning —
# they never write framing language, and they never learn why a tower renders
# as a paper cutout rather than a photograph. That knowledge lives here.
#
# `framing` is the clause the prompt builder splices into SCENE. Every entry
# uses paper-and-card language rather than "archival photo cutout", because a
# controlled test on 2026-07-26 showed photo framing pulls printed detail:
# the same dial rendered numerals under photo framing and stayed clean under
# card framing, with no negation in either prompt. See scene-guidance.txt.
#
# `lettering_risk: high` marks objects that natively carry typography. Those
# need their surface described positively (what IS on it) as well as framed as
# card — see the `surface` field.

version: 1

through_lines:
  - id: tower-signal
    label: Broadcast tower, signal rings shrinking
    use_when: Reach, coverage, or a service going dark.
    framing: >
      a tall broadcast tower rendered as a torn-paper cutout in flat charcoal
      on cream card, taped at one corner, with concentric hand-drawn black
      marker rings nested one inside the next, all sharing the mast as their
      common centre
    # The silhouette bible. Added 2026-07-28 because "a tall broadcast tower" is
    # ambiguous and every model resolves it to a different landmark — one run
    # produced a lattice mast, a CN-Tower-style observation deck, a pagoda form
    # and a slim spire across six blocks of the SAME story. That is not the model
    # failing to be consistent; it is four models' idea of the same three words.
    #
    # Tried first and abandoned: passing block 1 back as a reference image.
    # bria-fibo accepts `reference_images`, `image` and `image_url`, returns 200
    # on all three, and ignores all three — the same permissive-parameter trap as
    # seedance's `aspect_ratio`/`ratio`. GMI accepting a parameter has never meant
    # GMI reading it.
    #
    # So the lock is text, which is the lever MOO-424 already proved works for
    # palette. Say the shape precisely enough that only one object satisfies it,
    # and name the near-misses so they are excluded rather than left open.
    # v2, 2026-07-28. v1 ended in a list of negations — "NO observation deck, NO
    # disc, NO bulge, NO pod" — and two of six blocks grew a pod anyway. That is
    # scene-guidance.txt's own finding about text bleed applied to shape:
    # framing, not negation, is what drives what a model renders. The top is now
    # described by what IS there, and the near-misses are gone rather than
    # forbidden. A model given a positive description has nothing to resolve.
    silhouette: >
      the tower is a four-legged steel lattice mast: straight tapering sides of
      visible criss-cross triangular bracing all the way up, three horizontal
      cross-braces spaced along its height, and at the very top a bare crossed
      antenna spire — two thin plain rods, thinner than the mast below them,
      ending in points. The width of the tower decreases smoothly from base to
      tip with nothing wider than the section beneath it. Open framework
      throughout, so the cream background shows through the bracing
    escalation: rings contract block by block, outermost first
    # Countable escalation. The percentage phrasing ("about eighty percent
    # through that change") never rendered monotonically across six blocks —
    # block 6 came back with MORE rings than block 1, twice. Models render
    # things they can count. Stating an exact remaining count out of a stated
    # original is the difference between a quantity and a mood.
    #
    # v2, 2026-07-28. v1 was `start: 8` with the noun "hand-drawn marker rings
    # radiating from the mast", and block 1 came back with eight separate
    # circles scattered AROUND the mast rather than eight rings around it.
    # Eight is too many to nest legibly at 576x1024, so the count instruction
    # ("EXACTLY 8, count them") outran the arrangement instruction ("radiating
    # from the mast") and the model satisfied the one it could count.
    # Two changes, same defect: drop the start count to a nestable 6, and say
    # the arrangement positively — "concentric", "nested", "common centre" —
    # rather than leaving "radiating" to carry it alone.
    #
    # 6→1 rather than the 5→2 first proposed, because a six-block story needs
    # six DISTINCT counts (test_a_countable_escalation_falls_by_a_whole_unit —
    # two blocks sharing a count is the non-monotonic defect that killed the
    # percentage phrasing). 5→2 interpolates to 5,4,4,3,3,2. 6→1 is one ring
    # per block exactly, and leaves one lone ring in the finale rather than an
    # empty mast, so the kicker still has the motif to pay off.
    #
    # The noun deliberately does NOT repeat "nested one inside the next" from
    # the framing clause above: the final block draws exactly 1, and "draw 1
    # ring nested one inside the next" is a self-contradiction handed to the
    # model on the one block that has to settle and hold. Arrangement lives in
    # the object description, where it is true at any count; the count clause
    # states only the count.
    countable:
      noun: concentric hand-drawn marker rings centred on the mast
      start: 6
      end: 1
    lettering_risk: low

  - id: fuse
    label: A burning fuse
    use_when: A deadline, a countdown, an inevitability.
    framing: >
      a fuse cut from dark card threading across the frame, its lit end a small
      torn coral shape with hand-drawn spark strokes
    escalation: the unburnt length shortens each block
    lettering_risk: low

  - id: dollar-cut
    label: A dollar bill cut into strips
    use_when: Budgets, allocation, where money goes.
    # "labelled paper strips" was here until 2026-07-28 and is a POL-4 violation
    # written into the menu itself — an instruction to render text, on the object
    # already marked lettering_risk: high. The strips are distinguished by width
    # and by a marker line, never by a label; naming the categories is the
    # receipt's job, not the frame's.
    framing: >
      a large banknote-shaped rectangle of plain pale green card, its surface
      smooth and unengraved, being divided into separate paper strips of
      differing widths
    surface: >
      the card is flat matte green with a single hand-drawn marker line marking
      each division and nothing else printed on it
    escalation: one more strip separates each block
    lettering_risk: high

  - id: record
    label: A record growing
    use_when: Culture, revival, something small becoming large.
    framing: >
      a vinyl record as concentric rings of charcoal and cream card with a
      plain coral centre circle
    surface: >
      the centre circle is flat coral card carrying no printing
    escalation: grows from coaster-sized to monumental
    lettering_risk: high

  - id: scale
    label: A tipping scale
    use_when: Trade-offs, imbalance, who bears a cost.
    framing: >
      a balance scale built from torn navy card and hand-drawn marker lines,
      its pans plain cream card
    escalation: tilts further each block
    lettering_risk: low

  - id: balloon
    label: A balloon nearing a needle
    use_when: Bubbles, overextension, risk that has not popped yet.
    framing: >
      a balloon as a smooth coral paper shape against cream, a slender charcoal
      needle entering from the frame edge
    escalation: the gap between the two closes
    lettering_risk: low

# Question-on-prop: a short question rendered on a surface in block 1 or the
# finale, answered only in the kicker. This is the ONE place readable text is
# permitted — and only when the question maps to an entered fact ID (POL-4).
# Everywhere else, typography beats are expressed as abstract highlight bars,
# redaction blocks, marker circles and underlines.
question_on_prop:
  allowed: true
  requires_fact_mapping: true
  guidance: >
    Keep it to two or three words. Render it as hand-lettered marker on card
    rather than printed type — hand-drawn lettering garbles less visibly than
    a typeface, and it reads as annotation rather than as quotation.
