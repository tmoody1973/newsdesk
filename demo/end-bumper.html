<!doctype html>
<html><head><meta charset="utf-8"><title>Newsdesk — end bumper</title>
<style>
  html, body { margin: 0; height: 100%; background: #f9f6ee; overflow: hidden; }
  .stage { display: grid; place-items: center; height: 100%; }
  .mark { opacity: 0; transform: translateY(14px) scale(.985);
          animation: land 1.1s cubic-bezier(.2,.7,.2,1) .6s forwards; }
  .mark img { height: 46vh; display: block; }
  .line { opacity: 0; animation: land .9s cubic-bezier(.2,.7,.2,1) 1.9s forwards;
          font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px;
          color: #7c7a74; text-align: center; margin-top: 34px; letter-spacing: .04em; }
  @keyframes land { from { opacity: 0; transform: translateY(14px) scale(.985); }
                    to { opacity: 1; transform: none; } }
</style></head>
<body><div class="stage"><div>
  <div class="mark"><img src="../web/public/brand/newsdesk-stacked-light.svg" alt="Newsdesk"></div>
  <p class="line">it refuses to say what it cannot prove</p>
</div></div></body></html>
